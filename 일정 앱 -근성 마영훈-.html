만든사람 근성 마영훈
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>내 할 일 목록</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background: 
#f5f5f5;
    }
    h1 { text-align: center; }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: 
#4f46e5;
      color: white;
      cursor: pointer;
    }
    ul { list-style: none; padding: 0; }
    li {
      background: white;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    li.done span { text-decoration: line-through; color: #999; }
    .delete {
      margin-left: auto;
      background: 
#ef4444;
      padding: 6px 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>📝 내 할 일</h1>
  <div class="input-row">
    <input id="todoInput" placeholder="할 일을 입력하세요" />
    <button onclick="addTodo()">추가</button>
  </div>
  <ul id="todoList"></ul>
  <script>
    const list = document.getElementById('todoList');
    const input = document.getElementById('todoInput');
    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.textContent = text;
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.onchange = () => li.classList.toggle('done');
      const delBtn = document.createElement('button');
      delBtn.textContent = '삭제';
      delBtn.className = 'delete';
      delBtn.onclick = () => li.remove();
      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      list.appendChild(li);
      input.value = '';
    }
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTodo();
    });
  </script>
</body>
</html>
